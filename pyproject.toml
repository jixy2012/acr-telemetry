[project]
name = "acr-telemetry"
version = "0.1.0"
description = "Full-rate telemetry capture for Assetto Corsa Rally"
readme = "README.md"
requires-python = ">=3.13"
# The logger itself is stdlib-only and stays that way: nothing in the
# capture path should be able to fail on a dependency. numpy is imported
# lazily, by the raw reader only.
dependencies = ["numpy>=2.0"]

[project.scripts]
acr-telemetry = "acr_telemetry:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"
